services:
  app:
    build:
      context: ../outdoor-eshop
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/outdoor_eshop
      PRODUCT_IMAGE_DIRECTORY: /var/lib/outdoor-eshop/product-images
    ports:
      - "3000:3000"
    volumes:
      - product_images:/var/lib/outdoor-eshop/product-images
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: outdoor_eshop_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}    
      POSTGRES_DB: outdoor_eshop
      TZ: Europe/Bratislava
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: outdoor_eshop_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  product_images: