services:
  init:
    image: ${COMPOSE_PROJECT_NAME:-outdoor-eshop}-app
    build:
      context: ../outdoor-eshop
    command: ["node", "--import", "tsx", "scripts/docker-bootstrap.ts"]
    environment:
      DATABASE_URL: postgres://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/outdoor_eshop
      BOOTSTRAP_MODE: ${BOOTSTRAP_MODE:-demo}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${COMPOSE_PROJECT_NAME:-outdoor-eshop}-app
    build:
      context: ../outdoor-eshop
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/outdoor_eshop
      PRODUCT_IMAGE_DIRECTORY: /var/lib/outdoor-eshop/product-images
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - product_images:/var/lib/outdoor-eshop/product-images
    depends_on:
      init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}    
      POSTGRES_DB: outdoor_eshop
      TZ: Europe/Bratislava
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  product_images: